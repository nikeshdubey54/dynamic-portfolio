{% extends 'base.html' %}

{% block title %}Protected Area | Portfolio{% endblock %}

{% block content %}

<section class="py-5">
    <div class="container text-center">

        <h2 class="fw-bold">Authentication Successful</h2>

        <p class="text-muted">
            Welcome, {{ request.user.username }}
        </p>

        <form method="post" action="{% url 'accounts:logout' %}" class="mt-4">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Logout
            </button>
        </form>

    </div>
</section>

{% endblock %}
