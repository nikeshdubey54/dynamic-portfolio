{% url 'home' as home_url %}
{% url 'about' as about_url %}
{% url 'skills' as skills_url %}
{% url 'projects' as projects_url %}

<nav class="navbar navbar-expand-lg navbar-dark sticky-top custom-navbar">
    <div class="container">

        <a class="navbar-brand d-flex align-items-center fw-bold fs-3"
            href="{% url 'home' %}">

                <span class="text-primary me-2">
                    &lt;/&gt;
                </span>

                <span class="brand-text">
                    Nikesh Portfolio
                </span>

        </a>

        <button class="navbar-toggler border-0 shadow-none"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto align-items-lg-center">

                <li class="nav-item">
                   <a class="nav-link {% if request.path == home_url %}active{% endif %}"
                        href="{{ home_url }}">
                            Home
                    </a> 
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.path == about_url %}active{% endif %}"
                        href="{{ about_url }}">
                            About
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.path == skills_url %}active{% endif %}"
                        href="{{ skills_url }}">
                            Skills
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.path == projects_url %}active{% endif %}"
                        href="{{ projects_url }}">
                            Projects
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Services</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Blog</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Contact</a>
                </li>

            </ul>

        </div>

    </div>
</nav>
