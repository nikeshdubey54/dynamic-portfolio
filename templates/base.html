{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="{% block meta_description %}{{ SITE_DESCRIPTION }}{% endblock %}">

    <meta name="keywords"
        content="{{ SITE_KEYWORDS }}">

    <meta name="author"
        content="{{ SITE_AUTHOR }}">

    <meta name="robots"
        content="index, follow">

    <!-- Canonical URL -->
    <link rel="canonical"
        href="{{ request.build_absolute_uri }}">

    <!-- Open Graph -->
    <meta property="og:type"
        content="website">

    <meta property="og:title"
        content="{% block og_title %}{{ SITE_NAME }}{% endblock %}">

    <meta property="og:description"
        content="{% block og_description %}{{ SITE_DESCRIPTION }}{% endblock %}">

    <meta property="og:url"
        content="{{ request.build_absolute_uri }}">

    <meta property="og:site_name"
        content="{{ SITE_NAME }}">

    <!-- Twitter / Social Sharing -->
    <meta name="twitter:card"
        content="summary_large_image">

    <meta name="twitter:title"
        content="{% block twitter_title %}{{ SITE_NAME }}{% endblock %}">

    <meta name="twitter:description"
        content="{% block twitter_description %}{{ SITE_DESCRIPTION }}{% endblock %}">

    <title>
        {% block title %}
        Dynamic Portfolio
        {% endblock %}
        </title>

    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
   
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="{% static 'images/icons/favicon.jpg' %}">
    <!-- Custom CSS -->

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
    <link rel="stylesheet" href="{% static 'css/animation.css' %}">

    {% block extra_css %}
    {% endblock %}

</head>

<body>

    {% include 'includes/navbar.html' %}

    {% block content %}

    {% endblock %}
    {% include 'includes/footer.html' %}

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->

    <script src="{% static 'js/main.js' %}"></script>
    
    

</body>

</html>
